  <defs>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="330" y1="0" x2="712" y2="0">
      <stop offset="0%" stop-color="#00D2BE" stop-opacity="1" />
      <stop offset="100%" stop-color="#00D2BE" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .edge  { stroke: #00D2BE; stroke-width: 1; stroke-opacity: .12;
             animation: flow 3.2s ease-in-out infinite; }
    .halo  { fill: #00D2BE; filter: url(#soft); opacity: .35;
             animation: breathe 2.8s ease-in-out infinite; }
    .t     { opacity: 0; animation: rise .7s ease-out forwards; }
    .rule  { stroke-dasharray: 382; stroke-dashoffset: 382;
             animation: draw 1.1s ease-out .5s forwards; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes flow    { 0%,100% { stroke-opacity: .10 } 50% { stroke-opacity: .58 } }
    @keyframes breathe { 0%,100% { opacity: .20 }        50% { opacity: .55 } }
    @keyframes rise    { from { opacity: 0; transform: translateY(6px) } to { opacity: 1 } }
    @keyframes draw    { to { stroke-dashoffset: 0 } }
    @keyframes blink   { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .edge, .halo, .caret { animation: none }
      .edge { stroke-opacity: .3 } .halo { opacity: .35 }
      .t { opacity: 1; animation: none } .rule { stroke-dashoffset: 0; animation: none }
    }
  </style>

